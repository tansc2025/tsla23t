<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TSLA23T Trading Rule System</title>

  <link rel="stylesheet" href="styles.css"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>

<body>

<div id="splash">
  <div class="splash-box">
    <h1>TSLA23T</h1>
    <p>Trading Rule System v3</p>

    <input
      id="apikey"
      placeholder="Finnhub API Key (optional)"
      type="text"
    />

    <button id="enterBtn">ENTER SYSTEM</button>

    <small>
      Leave empty to use simulation mode
    </small>
  </div>
</div>

<div id="app">

  <header>
    <div>
      <h2>TSLA23T</h2>
      <p>Quant Trading Dashboard</p>
    </div>

    <div id="clock"></div>
  </header>

  <section class="toolbar">

    <select id="stock">
      <option>TSLA</option>
      <option>NVDA</option>
      <option>AMD</option>
      <option>PLTR</option>
      <option>RKLB</option>
      <option>ASTS</option>
    </select>

    <select id="days">
      <option value="60">60 Days</option>
      <option value="120" selected>120 Days</option>
      <option value="240">240 Days</option>
    </select>

    <button id="scanBtn">
      Scan
    </button>

  </section>

  <section id="signalBox"></section>

  <div class="chart-box">
    <h3>Price Chart</h3>
    <canvas id="mainChart"></canvas>
  </div>

  <div class="chart-box">
    <h3>RSI</h3>
    <canvas id="rsiChart"></canvas>
  </div>

  <div class="chart-box">
    <h3>MACD</h3>
    <canvas id="macdChart"></canvas>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
