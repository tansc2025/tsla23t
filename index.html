<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TSLA23T 交易規則系統 v3 (完美穩定版)</title>

<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.0/dist/chartjs-adapter-luxon.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.window.min.js"></script>

<style>
:root{--bg:#03060d;--bg2:#070d1a;--bg3:#0c1525;--border:#1a2e44;--border2:#243548;--gold:#f5c842;--green:#00e676;--red:#ff1744;--blue:#00b0ff;--purple:#ce93d8;--text:#e0eaf5;--text2:#8aafcc;--text3:#3a6080}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden;font-size:13px}
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
.sg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,176,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,176,255,.04) 1px,transparent 1px);background-size:40px 40px}
.sglow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(245,200,66,.13),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.scont{position:relative;text-align:center;padding:20px}
.slogo{font-size:clamp(36px,8vw,68px);font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#f5c842,#fff8e1,#f5c842,#b8960c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.ssub{font-size:12px;letter-spacing:4px;color:var(--text3);margin-bottom:16px}
.sauth{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:24px;border:1px solid rgba(245,200,66,.3);padding:5px 18px;display:inline-block;border-radius:2px}
.schips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.chip{font-size:10px;letter-spacing:1px;padding:3px 10px;border-radius:2px;border:1px solid}
.chip.r{border-color:rgba(255,23,68,.4);color:var(--red);background:rgba(255,23,68,.06)}
.chip.g{border-color:rgba(0,230,118,.4);color:var(--green);background:rgba(0,230,118,.06)}
.chip.y{border-color:rgba(245,200,66,.4);color:var(--gold);background:rgba(245,200,66,.06)}
.sbtn{font-size:12px;letter-spacing:3px;background:linear-gradient(135deg,#b8960c,#f5c842,#b8960c);color:#030608;font-weight:700;padding:12px 40px;border:none;cursor:pointer;border-radius:2px;box-shadow:0 0 25px rgba(245,200,66,.4);transition:all .3s}
.sbtn:hover{transform:scale(1.04)}
.api-wrap{margin-bottom:24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.api-wrap label{font-size:10px;letter-spacing:2px;color:var(--text3)}
.api-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:12px;padding:8px 14px;border-radius:4px;width:260px;text-align:center;letter-spacing:1px}
.api-input:focus{outline:none;border-color:var(--gold)}
.api-note{font-size:10px;color:var(--text3);letter-spacing:.5px}
.api-note a{color:var(--gold);text-decoration:none}
#app{display:none}
#app.show{display:block}
#topbar{position:sticky;top:0;z-index:200;background:rgba(3,6,13,.97);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:13px;font-weight:700;letter-spacing:3px;background:linear-gradient(90deg,var(--gold),#fff8e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bsub{font-size:9px;letter-spacing:2px;color:var(--text3);margin-top:1px}
.ck{font-size:12px;color:var(--blue);letter-spacing:1px;text-align:right}
.ckd{font-size:9px;color:var(--text3);margin-top:2px;text-align:right}
#api-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 14px;display:flex;align-items:center;justify-content:space-between;font-size:10px}
.api-status{display:flex;align-items:center;gap:6px}
.api-dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.api-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.api-dot.sim{background:var(--gold)}
.api-dot.err{background:var(--red)}
.api-edit{color:var(--text3);cursor:pointer;font-size:10px;letter-spacing:1px;background:none;border:none;padding:0}
.api-edit:hover{color:var(--gold)}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 13px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--text3);font-size:11px;letter-spacing:1px;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.panel{display:none;padding:12px 11px 60px}
.panel.active{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;align-items:flex-end}
label{font-size:10px;color:var(--text2);letter-spacing:1px;display:block;margin-bottom:3px}
select,input[type=number]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:12px;padding:7px 9px;border-radius:4px;-webkit-appearance:none;appearance:none}
input[type=text]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:12px;padding:7px 9px;border-radius:4px;}
select:focus,input:focus{outline:none;border-color:var(--gold)}
.btn{font-size:10px;letter-spacing:2px;background:linear-gradient(135deg,#2a1f04,#3a2d06);color:var(--gold);border:1px solid rgba(245,200,66,.35);padding:8px 15px;cursor:pointer;border-radius:3px;white-space:nowrap}
.btn:hover{background:rgba(245,200,66,.15)}
#sigbox{border-radius:6px;padding:12px;margin-bottom:11px;border:1px solid var(--border2);background:var(--bg2)}
.smain{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.sicon{font-size:40px;line-height:1}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--gold)}
.sprice{font-size:20px;font-weight:700}
.schg{font-size:11px;margin-top:2px}
.cw{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:9px;margin-bottom:9px}
.ct{font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:7px}
.loading-bar{text-align:center;padding:30px;color:var(--text3);font-size:11px;letter-spacing:2px}
.spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:24px;width:300px;text-align:center}
.modal-box h3{color:var(--gold);letter-spacing:2px;font-size:13px;margin-bottom:14px}
.modal-box p{font-size:11px;color:var(--text2);margin-bottom:14px;line-height:1.7}
</style>
</head>
<body>

<div id="splash">
  <div class="sg"></div>
  <div class="sglow"></div>
  <div class="scont">
    <div class="slogo">TSLA23T</div>
    <div class="ssub">Trading Rule System &middot; v
