<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Stock Quote (Finnhub Demo)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
    }
    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }
    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <h2>Stock Quote Checker</h2>

  <input id="symbol" placeholder="Enter symbol (e.g. AAPL)" />
  <input id="apiKey" placeholder="Enter Finnhub API key" />

  <button onclick="getQuote()">Get Quote</button>

  <pre id="output">Result will appear here...</pre>

  <script>
    async function getQuote() {
      const symbol = document.getElementById("symbol").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();

      if (!symbol || !apiKey) {
        document.getElementById("output").textContent =
          "Please enter both symbol and API key.";
        return;
      }

      try {
        const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${apiKey}`;

        const res = await fetch(url);
        const data = await res.json();

        document.getElementById("output").textContent =
          JSON.stringify(data, null, 2);

      } catch (err) {
        document.getElementById("output").textContent =
          "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
